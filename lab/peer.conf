# Lab-only neighbour AS64497. The three prefixes pair with lab/slurm.json:
#   2001:db8:100::/48  ROA for AS64497 -> valid,   must be imported
#   2001:db8:200::/48  ROA for AS64499 -> invalid, must be rejected
#   2001:db8:300::/48  no ROA          -> unknown, must be imported
router id 192.0.2.3;
log stderr all;
protocol device {}
protocol static {
  ipv6;
  route 2001:db8:100::/48 blackhole;
  route 2001:db8:200::/48 blackhole;
  route 2001:db8:300::/48 blackhole;
}
protocol bgp up {
  local as 64497;
  neighbor fd00:179::b:1 as 64496;
  ipv6 { import all; export where source = RTS_STATIC; };
}
