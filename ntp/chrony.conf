# Public NTP + NTS server (NTP Pool style). The same daemon disciplines the
# host clock, which is why the container holds SYS_TIME on the host network.
pool pool.ntp.org iburst
server time.cloudflare.com iburst nts

allow
ratelimit interval 1 burst 16

# NTS-KE listens on tcp/4460 once a cert + key are configured.
ntsservercert /certs/fullchain.pem
ntsserverkey /certs/privkey.pem
ntsdumpdir /var/lib/chrony

driftfile /var/lib/chrony/drift
makestep 1 3
rtcsync
