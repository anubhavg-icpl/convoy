# Runs the repo's one gate (see AGENTS.md): build every image, boot the offline
# lab, run lab/test.sh, tear down. Needs nothing but Docker on the runner.
name: check
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # pinned to a commit: tags are mutable
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: ./convoy check
